[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "surveilx-edge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=14,<18", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2,<3", "psutil>=6,<8", "numpy>=2,<3", "opencv-python>=4.10,<5", "cryptography>=43", "httpx>=0.27,<1", "argon2-cffi>=23", "boto3>=1.35,<2"]

[project.optional-dependencies]
research = ["torch>=2.5", "onnx>=1.17", "onnxscript>=0.2", "onnxruntime>=1.20", "ultralytics==8.4.163"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["surveilx*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
